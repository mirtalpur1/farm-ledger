<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Ledger Settlement Calculator</title>
  <style>
    /* Reset & Base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      line-height: 1.5;
      background-color: #f9f9f9;
      color: #333;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .form-group input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .form-group input[type="checkbox"] {
      margin-right: 8px;
    }
    .optional-section {
      padding: 12px;
      background-color: #f0f0f0;
      border-radius: 4px;
      margin-top: 8px;
    }
    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button#calculate {
      background-color: #28a745;
      color: white;
    }
    button#reset {
      background-color: #dc3545;
      color: white;
    }
    .result {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: #f8f8f8;
    }
    .result p {
      margin-bottom: 8px;
    }
    .details {
      margin-top: 16px;
      display: none;
    }
    .details h3 {
      margin-bottom: 12px;
    }
    .info-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      background-color: #007bff;
      color: white;
      border-radius: 50%;
      text-align: center;
      font-size: 12px;
      line-height: 16px;
      cursor: pointer;
      margin-left: 4px;
    }
    .tooltip {
      position: relative;
      display: inline-block;
    }
    .tooltip .tooltiptext {
      visibility: hidden;
      width: 200px;
      background-color: #333;
      color: #fff;
      text-align: left;
      border-radius: 4px;
      padding: 8px;
      position: absolute;
      z-index: 1;
      bottom: 125%; /* show above */
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .tooltip:hover .tooltiptext {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1>Farm Ledger Settlement Calculator</h1>

  <div class="container">
    <div class="form-group">
      <label for="totalRevenue">Total Revenue (Sale) <span class="tooltip">ℹ
        <span class="tooltiptext">Gross sale value of crop(s)</span>
      </span></label>
      <input type="number" id="totalRevenue" placeholder="0.00" step="any" />
    </div>

    <div class="form-group">
      <label for="ownerSharePct">Owner’s Share (%) <span class="tooltip">ℹ
        <span class="tooltiptext">Fraction for owner, e.g. 50 for half</span>
      </span></label>
      <input type="number" id="ownerSharePct" placeholder="e.g. 50" step="any" />
    </div>

    <fieldset>
      <legend>Costs / Expenses</legend>
      <div class="form-group">
        <label for="costFertilizer">Fertilizer / Seed etc.</label>
        <input type="number" id="costFertilizer" placeholder="0.00" step="any" />
      </div>
      <div class="form-group">
        <label for="costPlow">Ploughing / Cultivation</label>
        <input type="number" id="costPlow" placeholder="0.00" step="any" />
      </div>
      <div class="form-group">
        <label for="costOther">Other Costs</label>
        <input type="number" id="costOther" placeholder="0.00" step="any" />
      </div>
    </fieldset>

    <div class="form-group">
      <input type="checkbox" id="hasSharecropperCosts" />
      <label for="hasSharecropperCosts">Sharecropper paid some costs</label>
    </div>

    <div id="sharecropperCostSection" class="optional-section" style="display: none;">
      <div class="form-group">
        <label for="scCostFertilizer">SC’s Fertilizer / Seed share</label>
        <input type="number" id="scCostFertilizer" placeholder="0.00" step="any" />
      </div>
      <div class="form-group">
        <label for="scCostPlow">SC’s Ploughing / Cultivation</label>
        <input type="number" id="scCostPlow" placeholder="0.00" step="any" />
      </div>
      <div class="form-group">
        <label for="scCostOther">SC’s Other Costs</label>
        <input type="number" id="scCostOther" placeholder="0.00" step="any" />
      </div>
    </div>

    <div class="buttons">
      <button id="calculate">Calculate</button>
      <button id="reset">Reset</button>
    </div>

    <div class="result" id="resultSection" style="display: none;">
      <h2>Result</h2>
      <p id="summaryText"></p>
      <button id="toggleDetails">Show detail breakdown</button>
      <div class="details" id="detailSection">
        <h3>Detailed Breakdown</h3>
        <p id="detailText"></p>
      </div>
    </div>

  </div>

  <script>
    // Helper: format number
    function fmt(x) {
      return parseFloat(x).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    document.getElementById('hasSharecropperCosts')
      .addEventListener('change', function() {
        const sec = document.getElementById('sharecropperCostSection');
        sec.style.display = this.checked ? 'block' : 'none';
      });

    document.getElementById('calculate').addEventListener('click', function() {
      const rev = parseFloat(document.getElementById('totalRevenue').value) || 0;
      const ownerPct = parseFloat(document.getElementById('ownerSharePct').value) || 0;

      const cF = parseFloat(document.getElementById('costFertilizer').value) || 0;
      const cP = parseFloat(document.getElementById('costPlow').value) || 0;
      const cO = parseFloat(document.getElementById('costOther').value) || 0;
      const totalCosts = cF + cP + cO;

      let scCosts = 0;
      if (document.getElementById('hasSharecropperCosts').checked) {
        const scF = parseFloat(document.getElementById('scCostFertilizer').value) || 0;
        const scP = parseFloat(document.getElementById('scCostPlow').value) || 0;
        const scO = parseFloat(document.getElementById('scCostOther').value) || 0;
        scCosts = scF + scP + scO;
      }

      // Core logic: allocate revenue minus costs, then deduct SC costs if any
      const net = rev - totalCosts;
      const ownerShare = net * (ownerPct / 100);
      const scShare = net - ownerShare;
      // Settlement: owner gives to SC or SC gives to owner?
      // Let “transfer” be amount owed by one party to the other:
      let transfer = scShare - scCosts;
      let transferText = '';
      if (transfer > 0) {
        transferText = `Owner pays sharecropper: ${fmt(transfer)}`;
      } else if (transfer < 0) {
        transferText = `Sharecropper returns to owner: ${fmt(-transfer)}`;
      } else {
        transferText = `No transfer needed`;
      }

      // Show results
      document.getElementById('summaryText').textContent =
        `Net revenue after costs: ${fmt(net)}\n` +
        `Owner’s share: ${fmt(ownerShare)}\n` +
        `Sharecropper’s share (before costs): ${fmt(scShare)}\n` +
        transferText;

      // Detail text
      const det = `
Total revenue: ${fmt(rev)}  
Total costs (owner + general): ${fmt(totalCosts)}  
Sharecropper’s cost contributions: ${fmt(scCosts)}  

Net = revenue − costs = ${fmt(net)}  
Owner portion = net × (${ownerPct}% ) = ${fmt(ownerShare)}  
Sharecropper portion = net − owner = ${fmt(scShare)}  

Transfer = sharecropper’s portion − sharecropper’s cost contributions = ${fmt(transfer)}  
${transfer > 0 ? 'Owner pays that to sharecropper.' : transfer < 0 ? 'Sharecropper returns that to owner.' : 'Balances exactly.'}
      `;
      document.getElementById('detailText').textContent = det;

      document.getElementById('resultSection').style.display = 'block';
    });

    document.getElementById('reset').addEventListener('click', function() {
      document.querySelectorAll('input').forEach(inp => {
        if (inp.type === 'number') inp.value = '';
        if (inp.type === 'checkbox') inp.checked = false;
      });
      document.getElementById('sharecropperCostSection').style.display = 'none';
      document.getElementById('resultSection').style.display = 'none';
    });

    document.getElementById('toggleDetails').addEventListener('click', function() {
      const det = document.getElementById('detailSection');
      if (det.style.display === 'block') {
        det.style.display = 'none';
        this.textContent = 'Show detail breakdown';
      } else {
        det.style.display = 'block';
        this.textContent = 'Hide detail breakdown';
      }
    });
  </script>
</body>
</html>
